[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remo-cli"
version = "0.1.0"
description = "Project-aware terminal companion for developers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Nikhil", email = "nikhil2004.blip@gmail.com" }]
keywords = ["cli", "developer-tools", "productivity", "terminal", "reminders"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black"]

[project.scripts]
remo = "remo.cli:main"

[project.urls]
Homepage = "https://github.com/nikhil2004-blip/remo-cli"
Issues = "https://github.com/nikhil2004-blip/remo-cli/issues"

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.hatch.build.targets.wheel]
packages = ["remo"]

